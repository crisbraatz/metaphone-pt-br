name: Benchmarks

# On-demand only: runs the 3.0.0 vs 2.0.14 Encode comparison on demand.
on:
  workflow_dispatch:
    inputs:
      job:
        description: "BenchmarkDotNet job (short is a quick run; default is the authoritative measurement)"
        type: choice
        # The Dry job is intentionally not offered: it is a harness check that
        # executes every case once, not a measurement.
        options:
          - default
          - short
        default: default

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  encode-comparison:
    name: Encode comparison (${{ inputs.job }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - run: dotnet restore
      # BenchmarkDotNet's generated project is opted out of lock-file/locked-mode
      # restore in Directory.Build.props (see ADR-003), so this works with CI=true.
      - name: Run benchmarks
        env:
          JOB: ${{ inputs.job }}
        run: dotnet run -c Release --no-restore --project benchmarks/MetaphonePtBr.Benchmarks -- --filter '*EncodeComparison*' --job "$JOB" --exporters github
      - name: Publish summary
        if: always()
        run: cat BenchmarkDotNet.Artifacts/results/*-report-github.md >> "$GITHUB_STEP_SUMMARY" || echo 'No benchmark report produced' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: benchmark-results
          path: BenchmarkDotNet.Artifacts/

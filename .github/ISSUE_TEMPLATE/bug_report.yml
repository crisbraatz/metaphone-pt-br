name: Bug report
description: A word produces a wrong token, or the library misbehaves.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: 3.0.0
    validations:
      required: true
  - type: input
    id: framework
    attributes:
      label: Target framework
      placeholder: net10.0 / net48
  - type: textarea
    id: repro
    attributes:
      label: Input and result
      description: The word(s), the token you got and the token you expected (and why).
      placeholder: |
        Input: "Xícara"
        Actual: ...
        Expected: ...
    validations:
      required: true

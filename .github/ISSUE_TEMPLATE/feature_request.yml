name: Feature or rule request
description: Suggest a new phonetic rule, a rule change or an API improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today? Include example words.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The rule or API you suggest.
